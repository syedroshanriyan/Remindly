name: remindly
description: Never miss what matters.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_tts: ^4.2.2
  speech_to_text: ^7.3.0
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/remindly_icon.png"
  adaptive_icon_foreground: "assets/icons/remindly_icon.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/ml/
